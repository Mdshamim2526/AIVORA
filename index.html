<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>NEHA — বাংলা AI সহকারী</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#101426;color:#f7f5ff;font-family:system-ui,"Noto Sans Bengali",sans-serif}
    main{width:min(680px,100%);padding:36px 24px;text-align:center;border:1px solid #34314f;border-radius:24px;background:linear-gradient(145deg,#211d3b,#17283a);box-shadow:0 24px 80px #0005}
    .mark{width:76px;height:76px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#b69cff,#72e6d7);color:#17152a;font-size:38px}
    h1{margin:0;font-size:clamp(34px,8vw,54px);letter-spacing:3px}p{color:#c4c2d7;line-height:1.8}
    .status{display:inline-block;margin-top:12px;padding:8px 14px;border:1px solid #454064;border-radius:99px;color:#8debdc;font-size:14px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>NEHA</h1>
    <p>তোমার বাংলা AI সহকারী</p>
    <p>নতুন NEHA প্রজেক্টের ভিত্তি এখানে শুরু হচ্ছে।</p>
    <span class="status">প্রস্তুতির পর্যায়ে</span>
  </main>
</body>
</html>
